send_anonymous_usage_stats: true
project_id: "tap-freshservice"
default_environment: test
elt:
  buffer_size: 209715200  # 200 MiB; max Singer line size is half (100 MiB)
environments:
  - name: test
plugins:
  extractors:
    - name: "tap-freshservice"
      namespace: "tap_freshservice"
      pip_url: -e .
      capabilities:
        - catalog
        - discover
        - about
        - stream-maps
      config:
        api_key: $TAP_FRESHSERVICE_API_KEY
        url_base: https://datateer.freshservice.com/api/v2
        ticket_lookback_days: 45
        flattening_enabled: false
      settings:
        - name: api_key
          kind: password
        - name: url_base
        - name: ticket_lookback_days
      select:
        - time_entries.*
  loaders:
    - name: target-jsonl
      variant: andyh1203
      pip_url: target-jsonl
      config:
        destination_path: output/
